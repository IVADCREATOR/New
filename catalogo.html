<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"><meta name="robots" content="index,follow"><title>Sorasaki — Catálogo</title><link rel="stylesheet" href="style.css?v=20260909f"><style>.catalog-hero{margin-top:28px;padding:28px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:radial-gradient(circle at 15% 20%,rgba(150,80,255,.16),transparent 45%),rgba(255,255,255,.025)}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.catalog-card{overflow:hidden;display:flex;flex-direction:column}.catalog-card img{width:100%;height:190px;object-fit:cover}.catalog-card-body{padding:18px}.catalog-category{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#8d829c}.catalog-card h2{margin:7px 0}.catalog-price{font-size:25px;font-weight:800}.catalog-old{text-decoration:line-through;color:#777080;font-size:11px}.catalog-card p{color:#92899b;line-height:1.6}.catalog-empty{text-align:center;padding:50px;color:#81798c}@media(max-width:900px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.catalog-grid{grid-template-columns:1fr}}</style></head><body><div class="topbar"><div class="brand"><span class="dot"></span><div>Sorasaki<small>Catálogo</small></div></div><nav><a href="/">Resumo</a><a href="/grupos">Grupos</a><a href="/catalogo" class="active">Catálogo</a><a href="/noticias">Notícias</a><a href="/suporte">Suporte</a></nav></div><main><section class="catalog-hero"><span class="eyebrow">💜 CATÁLOGO SORASAKI</span><h1>Produtos disponíveis.</h1><p class="subtitle">Confira as opções publicadas pela equipe do Sorasaki.</p></section><section><div id="catalogGrid" class="catalog-grid"><div class="catalog-empty">Carregando catálogo...</div></div></section></main><div class="footer">Sorasaki — produtos e serviços</div><script>function esc(v){return String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}async function load(){const box=document.getElementById('catalogGrid');try{const r=await fetch('/api/public-content?type=products',{cache:'no-store',headers:{Accept:'application/json'}}),d=await r.json();if(!r.ok||!d?.ok)throw 0;const rows=d.products||[];box.innerHTML=rows.map(p=>{const price=Number(p.promo_price??p.price),old=p.promo_price!=null?Number(p.price):Number(p.previous_price||0);return `<article class="panel catalog-card">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="catalog-card-body">${p.category?`<div class="catalog-category">${esc(p.category)}</div>`:''}<h2>${esc(p.name)}</h2>${old>price?`<div class="catalog-old">R$ ${old.toFixed(2).replace('.',',')}</div>`:''}<div class="catalog-price">R$ ${price.toFixed(2).replace('.',',')}</div><p>${esc(p.description||'')}</p></div></article>`}).join('')||'<div class="catalog-empty">Nenhum produto disponível no momento.</div>'}catch(e){box.innerHTML='<div class="catalog-empty">Não foi possível carregar o catálogo agora.</div>';console.error(e)}}load();</script></body></html>
