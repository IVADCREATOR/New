<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://xwrsjfxsmpuqneriptfw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Sorasaki — Notícias</title><link rel="stylesheet" href="style.css?v=20260908e">
<style>.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.news-card{overflow:hidden}.news-card img{width:100%;height:190px;object-fit:cover;border-radius:12px}.news-card h2{margin:10px 0 6px}.news-card p{color:#92899b;line-height:1.6}.news-meta{font-size:9px;color:#756c80;text-transform:uppercase;letter-spacing:.08em}.news-alert{margin-bottom:14px}.news-empty{padding:35px;text-align:center;color:#81798c}@media(max-width:700px){.news-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="topbar"><div class="brand"><span class="dot"></span><div>Sorasaki<small>Novidades e atualizações</small></div></div><nav><a href="/">Resumo</a><a href="/grupos">Grupos</a><a href="/catalogo">Catálogo</a><a href="/noticias" class="active">Notícias</a><a href="/sobre">Sobre</a><a href="/suporte">Suporte</a></nav></div>
<main><section class="groups-hero"><div><span class="eyebrow">📰 CENTRAL DE NOVIDADES</span><h1>Fique por dentro do <span>SORASAKI.</span></h1><p>Atualizações, recursos, avisos e novidades publicadas pela equipe.</p></div></section>
<div id="notices"></div><section class="panel"><div class="section-heading"><div><span class="eyebrow">✦ ATUALIZAÇÕES</span><h2>Últimas notícias</h2></div></div><div id="newsGrid" class="news-grid"><div class="news-empty">Carregando novidades...</div></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260909a"></script>
<script>(async()=>{try{const r=await fetch('/api/public-content?type=all',{cache:'no-store',headers:{Accept:'application/json'}}),d=await r.json();if(!r.ok||!d?.ok)throw new Error('content');const esc=v=>String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]));document.getElementById('notices').innerHTML=(d.notices||[]).map(x=>`<div class="aviso news-alert" style="display:block"><strong>📌 ${esc(x.title)}</strong><br>${esc(x.message)}</div>`).join('');document.getElementById('newsGrid').innerHTML=(d.news||[]).map(x=>`<article class="panel news-card">${x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:''}<div class="news-meta">${esc(x.category)} · ${new Date(x.publish_at).toLocaleDateString('pt-BR')}</div><h2>${esc(x.title)}</h2><p>${esc(x.summary||String(x.content||'').slice(0,260))}</p><details><summary>Ver notícia completa</summary><p>${esc(x.content)}</p></details></article>`).join('')||'<div class="news-empty">Nenhuma novidade publicada ainda.</div>';}catch(e){document.getElementById('newsGrid').innerHTML='<div class="news-empty">Não foi possível carregar as novidades.</div>';console.error('[SORASAKI] Notícias:',e)}})();</script>
</body></html>
