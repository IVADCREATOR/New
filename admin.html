<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administração — Sorasaki</title><link rel="stylesheet" href="style.css?v=20260908a">
</head>
<body>
<div class="topbar"><div class="brand"><span class="dot"></span><div>Sorasaki<small>Administração</small></div></div><nav><a href="grupos.html">Grupos</a><a href="index.html">Voltar ao site</a></nav></div>
<main>
<section class="panel" style="margin-top:30px"><span class="eyebrow">👑 ÁREA RESTRITA</span><h1 style="margin-bottom:8px">Painel administrativo</h1><p style="color:var(--muted);margin-top:0">Gerencie os grupos enviados pela comunidade.</p></section>
<section class="groups-toolbar panel" style="margin-top:18px"><div class="group-search-wrap"><span>⌕</span><input id="adminSearch" type="search" placeholder="Pesquisar grupo..." autocomplete="off"></div><select id="adminStatus" aria-label="Filtrar por status"><option value="all">Todos</option><option value="pending">Em análise</option><option value="approved">Aprovados</option><option value="rejected">Recusados</option><option value="removed">Removidos</option></select></section>
<div id="adminMessage" class="groups-empty"><div>◌</div><strong>Verificando acesso</strong><span>Um instante...</span></div>
<section id="adminContent" hidden><div id="adminStats" class="groups-hero-stats panel"></div><div id="adminGroups" class="groups-grid" style="margin-top:18px"></div></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260908a"></script>
<script>
(async function(){const auth=window.SorasakiAuth;await auth.ready;const client=auth.getClient();const user=auth.getUser();const msg=document.getElementById('adminMessage'),content=document.getElementById('adminContent');if(!user){msg.innerHTML='<div>🔐</div><strong>Área restrita</strong><span>Entre na sua conta de administrador para continuar.</span>';setTimeout(()=>auth.requireLogin('Você precisa estar conectado para acessar esta área.'),300);return}const profile=await client.from('profiles').select('role').eq('user_id',user.id).maybeSingle();if(profile.error||profile.data?.role!=='admin'){msg.innerHTML='<div>🔒</div><strong>Acesso não disponível</strong><span>Esta área é reservada à administração.</span>';return}msg.hidden=true;content.hidden=false;let groups=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={pending:'🟡 Em análise',approved:'🟢 Aprovado',rejected:'🔴 Recusado',removed:'⚫ Removido'};async function load(){const {data,error}=await client.from('groups').select('id,owner_id,name,description,category,invite_url,status,featured_by_admin,admin_badge,admin_note,created_at').order('created_at',{ascending:false});if(error){msg.hidden=false;msg.innerHTML='<div>!</div><strong>Não foi possível carregar os grupos</strong><span>Tente novamente em alguns instantes.</span>';content.hidden=true;return}groups=data||[];render()}function render(){const q=document.getElementById('adminSearch').value.trim().toLowerCase(),s=document.getElementById('adminStatus').value;let list=groups.filter(g=>(s==='all'||g.status===s)&&(!q||`${g.name} ${g.description} ${g.category}`.toLowerCase().includes(q)));document.getElementById('adminStats').innerHTML=[['🟡',groups.filter(g=>g.status==='pending').length,'Pendentes'],['🟢',groups.filter(g=>g.status==='approved').length,'Publicados'],['🔴',groups.filter(g=>g.status==='rejected').length,'Recusados'],['⚫',groups.filter(g=>g.status==='removed').length,'Removidos']].map(x=>`<div><strong>${x[0]} ${x[1]}</strong><span>${x[2]}</span></div>`).join('');document.getElementById('adminGroups').innerHTML=list.map(g=>`<article class="group-card"><div class="group-card-top"><div class="group-icon">${g.featured_by_admin?'👑':'👥'}</div><span class="group-category">${esc(g.category)}</span><span class="group-featured">${labels[g.status]}</span></div><h2>${esc(g.name)}</h2><p>${esc(g.description)}</p><div class="group-meta"><span>${new Date(g.created_at).toLocaleDateString('pt-BR')}</span><span>ID ${g.id}</span></div><div style="display:grid;gap:8px;margin-top:14px"><select data-status="${g.id}">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${g.status===k?'selected':''}>${v}</option>`).join('')}</select><input data-note="${g.id}" maxlength="500" placeholder="Observação opcional" value="${esc(g.admin_note||'')}"><label style="display:flex;align-items:center;gap:8px;font-size:12px"><input data-featured="${g.id}" type="checkbox" ${g.featured_by_admin?'checked':''}> Destacar como indicado</label><select data-badge="${g.id}"><option value="">Sem selo</option><option value="oficial" ${g.admin_badge==='oficial'?'selected':''}>Oficial</option><option value="indicado" ${g.admin_badge==='indicado'?'selected':''}>Indicado</option><option value="parceiro" ${g.admin_badge==='parceiro'?'selected':''}>Parceiro</option></select><button class="auth-primary" data-save="${g.id}" type="button">Salvar alterações</button></div></article>`).join('')||'<div class="groups-empty"><div>⌕</div><strong>Nenhum grupo encontrado</strong><span>Altere os filtros para continuar.</span></div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=save)}async function save(e){const id=Number(e.currentTarget.dataset.save),status=document.querySelector(`[data-status="${id}"]`).value,admin_note=document.querySelector(`[data-note="${id}"]`).value.trim()||null,featured_by_admin=document.querySelector(`[data-featured="${id}"]`).checked,admin_badge=document.querySelector(`[data-badge="${id}"]`).value||null;const {error}=await client.from('groups').update({status,admin_note,featured_by_admin:status==='approved'&&featured_by_admin,admin_badge:status==='approved'?admin_badge:null,approved_at:status==='approved'?new Date().toISOString():null}).eq('id',id);e.currentTarget.textContent=error?'Tente novamente':'Salvo ✓';if(!error)await load();setTimeout(()=>e.currentTarget.textContent='Salvar alterações',1500)}document.getElementById('adminSearch').oninput=render;document.getElementById('adminStatus').onchange=render;load()})();
</script>
</body>
</html>
